---
name: Unity Cloud Build
# STUB producer for the ci-status-comment lab. Stands in for decentraland's real
# Unity Cloud Build workflow. It only needs to (a) be named "Unity Cloud Build"
# so the build comment workflow's workflow_run trigger matches, and (b) upload
# Decentraland_* artifacts so its "did the build actually run?" check passes.
# Both platform artifacts exist so release-cut.yml's per-platform rows resolve a
# download id for each; drop one to exercise the row that falls back to S3 only.
#
# For unity-explorer#10139 it also runs on pushes to dev (the run a release cut
# reads), on the `labeled` PR event (a force-build label is what re-builds a
# release PR), and reads two markers off the dev commit message:
#   [slow]        sleep 150s instead of 30s, so a cut can land mid-build
#   [fail-build]  fail the build, so a cut finds a failed dev run
# The push concurrency group mirrors the real one: a newer dev push cancels the
# build in flight.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build:
    # Named like the real matrix legs: the cut workflow's gate step asks the
    # jobs API for a green "Build (macos" and "Build (windows64" before it
    # dispatches the InWorld gate.
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [macos, windows64]
    steps:
      - name: Simulate a build
        env:
          MESSAGE: ${{ github.event.head_commit.message || '' }}
          TARGET: ${{ matrix.target }}
        run: |
          SECONDS_TO_SLEEP=30
          case "$MESSAGE" in *"[slow]"*) SECONDS_TO_SLEEP=150 ;; esac
          echo "Pretending to build ${TARGET} for ~${SECONDS_TO_SLEEP}s…"
          sleep "$SECONDS_TO_SLEEP"
          case "$MESSAGE" in *"[fail-build]"*) echo "::error::[fail-build] marker — failing as a real build would."; exit 1 ;; esac
          mkdir -p out
          echo "dummy build output" > "out/Decentraland_${TARGET}.txt"
          (cd out && zip -q "Decentraland_${TARGET}.zip" "Decentraland_${TARGET}.txt")
      - name: Upload dummy artifact
        uses: actions/upload-artifact@v4
        with:
          name: Decentraland_${{ matrix.target }}
          path: out/Decentraland_${{ matrix.target }}.zip
