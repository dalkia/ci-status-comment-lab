---
name: Comment Artifact URL on PR
# LAB copy — SIMPLIFIED. The real decentraland workflow also downloads size
# reports, looks up the latest release, computes S3 download URLs, and dispatches
# a performance test; none of that is reproducible outside decentraland. This
# copy keeps the part under test: the "build" section's pending -> success/failed
# flow through the ci-status-comment composite action.
#
# 'requested' -> reset the build section to "pending".
# 'completed' -> fill it in: Success (with commit + logs) / Failed.
#
# Added for unity-explorer#10139: the PR is resolved through
# resolve-comment-pr.sh (a push run on dev reports into the open release PR
# whose head is its SHA), and the release-gate / release-force-build jobs are
# copied from the real workflow, with `check-build-ran` folded away since this
# stub has no no-op runs.
on:
  workflow_run:
    types:
      - "requested"
      - "completed"
    workflows:
      - "Unity Cloud Build"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  pre-validation:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.check-pr.outputs.pr-number }}
      head-ref: ${{ steps.check-pr.outputs.head-ref }}
      head-sha: ${{ steps.check-pr.outputs.head-sha }}
      release-pr: ${{ steps.check-pr.outputs.release-pr }}
      backfill: ${{ steps.check-pr.outputs.backfill }}
    steps:
      - name: Checkout CI status action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/ci-status-comment
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve the PR this run reports into
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_RUN_EVENT_OBJ: ${{ toJSON(github.event.workflow_run) }}
        run: |
          bash .github/actions/ci-status-comment/resolve-comment-pr.sh > resolved.txt
          cat resolved.txt
          cat resolved.txt >> "$GITHUB_OUTPUT"

  comment-pending:
    needs: pre-validation
    if: github.event.action == 'requested' && needs.pre-validation.outputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI status action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ci-status-comment
          sparse-checkout-cone-mode: false

      - name: Reset build section to pending
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: build
          github-token: ${{ github.token }}
          body: |-
            ![Build](https://img.shields.io/badge/Build-Pending!-ffff00?logo=github&style=for-the-badge)  <img src="https://ui.decentraland.org/decentraland_256x256.png" width="30">

            New build in progress, come back later!

  comment-result:
    needs: pre-validation
    if: github.event.action == 'completed' && needs.pre-validation.outputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI status action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ci-status-comment
          sparse-checkout-cone-mode: false

      - name: Compose build section
        id: body
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          DELIM="EOF_$(uuidgen)"
          if [ "$CONCLUSION" = "success" ]; then
            BADGE="https://img.shields.io/badge/Build-Success!-3fb950?logo=unity&logoColor=white&style=for-the-badge"
            MSG=$'Windows and Mac build successful! _(stubbed lab build)_\n\n| Name | Value |\n| ---- | ---- |\n| Commit | '"$HEAD_SHA"$' |\n| Logs | '"$RUN_URL"$' |'
          else
            BADGE="https://img.shields.io/badge/Build-Failed!-ff0000?logo=unity&logoColor=white&style=for-the-badge"
            MSG="Build failed (\`$CONCLUSION\`)! Check the [logs](${RUN_URL})."
          fi
          {
            echo "body<<$DELIM"
            echo "![Build]($BADGE)  <img src=\"https://ui.decentraland.org/decentraland_256x256.png\" width=\"30\">"
            echo ""
            printf '%s\n' "$MSG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Update build section
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: build
          github-token: ${{ github.token }}
          body: ${{ steps.body.outputs.body }}

  # A release PR cannot start its own InWorld gate on the two paths that reach
  # here. The PR was opened with GITHUB_TOKEN, whose events start no runs, so a
  # dev build that finished after the cut (a back-filled run) has no gate; and
  # in-world-tests.yml does not listen to label events, so neither does a build
  # the `force-build` label started. Dispatch it against the release branch —
  # the dispatch path resolves the build with no wait, and both zips are up by
  # the time this run fires. A push to the branch starts the gate through its
  # own pull_request trigger, so a gate already in flight or green for this SHA
  # is left alone rather than cancelled by a second run in its concurrency group.
  release-gate:
    needs: pre-validation
    if: github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success' && needs.pre-validation.outputs.release-pr == 'true'
    runs-on: ubuntu-latest
    # actions: write — `gh workflow run`. workflow_dispatch is the one event
    # GITHUB_TOKEN is allowed to start a run with.
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch the InWorld gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.pre-validation.outputs.pr-number }}
          HEAD_REF: ${{ needs.pre-validation.outputs.head-ref }}
          HEAD_SHA: ${{ needs.pre-validation.outputs.head-sha }}
        run: |
          set -euo pipefail
          # A dispatch attaches its checks to the branch tip. A tip that moved
          # since this build belongs to a newer build, whose own completion
          # dispatches for it.
          LIVE_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          if [ "$LIVE_SHA" != "$HEAD_SHA" ]; then
            echo "::notice::PR #${PR_NUMBER} moved from ${HEAD_SHA:0:7} to ${LIVE_SHA:0:7}; the newer build's completion dispatches the gate."
            exit 0
          fi
          COVERED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/in-world-tests.yml/runs?head_sha=${HEAD_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length')
          if [ "$COVERED" != "0" ]; then
            echo "::notice::An InWorld gate run for ${HEAD_SHA:0:7} is in flight or green; not dispatching another."
            exit 0
          fi
          gh workflow run in-world-tests.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          echo "::notice::InWorld gate dispatched against ${HEAD_REF} for ${HEAD_SHA:0:7}."

  # A dev build of the cut commit that ends in anything but success leaves the
  # release with no build and no event that would start one: the cut seeded
  # "Building on dev" into the comment, and the PR raises no events of its own.
  # `force-build` builds a PR regardless, so add it — with the org token, since
  # a label added by GITHUB_TOKEN starts no run either. Back-filled dev runs
  # only: a release branch's own failed build is for a human to look at, and
  # re-labelling would not even re-trigger (the label is already on the PR).
  # Ordered after the failed/cancelled writers so this text is what stays up
  # until the new build's own writers reset the section.
  release-force-build:
    needs: [pre-validation, comment-result]
    if: >-
      !cancelled() &&
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion != 'success' &&
      needs.pre-validation.outputs.backfill == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI status action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/ci-status-comment
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Label the release PR force-build
        id: label
        env:
          GH_TOKEN: ${{ secrets.ORG_ACCESS_TOKEN }}
          PR_NUMBER: ${{ needs.pre-validation.outputs.pr-number }}
          HEAD_SHA: ${{ needs.pre-validation.outputs.head-sha }}
        run: |
          echo "short-sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          if gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label force-build; then
            echo "labeled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not add force-build to PR #${PR_NUMBER}; label it by hand to build the release branch."
            echo "labeled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update build section
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: build
          github-token: ${{ github.token }}
          body: |-
            [![Build](https://img.shields.io/badge/Build-${{ steps.label.outputs.labeled == 'true' && 'Building%20release%20branch' || 'Not%20Found' }}-yellow?logo=unity&logoColor=white&style=for-the-badge)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})

            The `dev` build of `${{ steps.label.outputs.short-sha }}`, the commit this release was cut from, ended `${{ github.event.workflow_run.conclusion }}` ([logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})), so there is nothing to reuse. ${{ steps.label.outputs.labeled == 'true' && 'This PR was labeled `force-build`; the release branch is building itself and its links land here.' || 'Labeling this PR `force-build` failed — add the label by hand to build the release branch.' }}
